<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elberadweg Day Planner</title>
    <!-- Leaflet's CSS is imported from the npm package in src/map.js (which owns
         all Leaflet specifics); app styles live in src/style.css via src/main.js. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🚲</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header id="app-header">
      <div id="app-title">
        Elberadweg Day Planner <span>Hamburg → Dresden</span>
      </div>
      <!-- ODbL requires the route/town data credit stay visible. It used to live
           in #panel-footer, which this layout drops; Task 14 moves it into the
           strip's scale line (the strip owns its own DOM, so it cannot live
           inside #strip yet). -->
      <div id="app-credit">
        Route &amp; town data © OpenStreetMap contributors (ODbL)
      </div>
      <div id="plans"></div>
    </header>
    <div id="app-body">
      <aside id="panel-left">
        <div id="places"></div>
      </aside>
      <div id="map">
        <!-- Camera controls, overlaid on the map they act on. Inside #map so they
             ride along with it; main.js keeps their events from reaching Leaflet
             underneath. -->
        <div id="map-controls">
          <button type="button" class="map-btn" data-action="focus-day">⤢ this day</button>
          <button type="button" class="map-btn" data-action="whole-route">⤢ whole route</button>
        </div>
      </div>
      <aside id="panel">
        <div id="banner" class="banner" hidden></div>
        <div id="day-panel"></div>
      </aside>
    </div>
    <div id="strip"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
