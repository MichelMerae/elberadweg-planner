<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elberadweg Day Planner</title>
    <!-- Leaflet's CSS is imported from the npm package in src/map.js (which owns
         all Leaflet specifics). The app's own stylesheet is ALSO imported by
         src/main.js; this link is what stops every cold dev load and every CSS
         hot-swap from painting the app unstyled for a frame first. Vite dedupes
         it in the production build (one emitted <link>, no double download). -->
    <link rel="stylesheet" href="/src/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🚲</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header id="app-header">
      <div id="app-title">
        Elberadweg Day Planner <span id="app-route"></span>
      </div>
      <!-- ODbL requires the route/town data credit stay visible, and here is where
           it lives: the layout that dropped #panel-footer put it in the header
           instead. (The plan's Task 14 also described moving it into the strip's
           scale line — deliberately not done, that would show it twice.) Leaflet's
           own tile credit in the map corner is a separate requirement. -->
      <div id="app-credit">
        Route &amp; town data © OpenStreetMap contributors (ODbL)
      </div>
      <div id="plans"></div>
    </header>
    <div id="app-body">
      <aside id="panel-left">
        <div id="places"></div>
      </aside>
      <div id="map">
        <!-- The picking prompt (spec §6/§8): what to click, what was picked, and why a
             pick was refused. It belongs where the rider is looking and where the click
             will land, so it lives over the map rather than in #banner — which is the
             route-data warning main.js rewrites from plan state on every save, and
             would wipe a prompt parked in it. Before #map-controls in source order so
             the instruction is read before the camera buttons. -->
        <div id="pick-banner" class="banner banner--pick" role="status" aria-live="polite" hidden></div>
        <!-- Camera controls, overlaid on the map they act on. Inside #map so they
             ride along with it; main.js keeps their events from reaching Leaflet
             underneath. -->
        <div id="map-controls">
          <button type="button" class="map-btn" data-action="focus-day">⤢ this day</button>
          <button type="button" class="map-btn" data-action="whole-route">⤢ whole route</button>
        </div>
      </div>
      <aside id="panel">
        <div id="banner" class="banner" hidden></div>
        <div id="day-panel"></div>
      </aside>
    </div>
    <div id="strip"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
