<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elberadweg Day Planner</title>
    <!-- Leaflet's CSS is imported from the npm package in src/map.js (which owns
         all Leaflet specifics); app styles live in src/style.css via src/main.js. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🚲</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header id="app-header">
      <div id="app-title">
        Elberadweg Day Planner <span>Hamburg → Dresden</span>
      </div>
      <!-- ODbL requires the route/town data credit stay visible. It used to live
           in #panel-footer, which this layout drops; Task 14 moves it into the
           strip's scale line (the strip owns its own DOM, so it cannot live
           inside #strip yet). -->
      <div id="app-credit">
        Route &amp; town data © OpenStreetMap contributors (ODbL)
      </div>
      <div id="plans"></div>
    </header>
    <div id="app-body">
      <aside id="panel-left">
        <div id="places"></div>
        <!-- Legacy containers. The current ui.js writes into these on creation and
             throws on a null element, so they must exist until the module that
             replaces them lands. Task 11 folds both into #places. -->
        <div id="favorites"></div>
        <div id="pois"></div>
      </aside>
      <div id="map"></div>
      <aside id="panel">
        <div id="banner" class="banner" hidden></div>
        <div id="day-panel"></div>
        <!-- Legacy containers, as above. Task 10 replaces #controls and #itinerary
             with #day-panel; #towns moves into #places in Task 11. -->
        <div id="controls"></div>
        <div id="towns"></div>
        <div id="itinerary"></div>
      </aside>
    </div>
    <div id="strip"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
